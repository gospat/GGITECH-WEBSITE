name: Deploy to production

on:
  # Every push that reaches main is deployed. Pull requests run the CI workflow
  # only, so nothing here can touch production before a change is merged.
  push:
    branches: [main]
  workflow_dispatch:

# Production deployments are serialised and never cancelled. Interrupting a run
# between the symlink swap and the health check would leave a release in an
# unknown state, so a second run queues behind the first instead of racing it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# The workflow reads the repository and nothing else; it never pushes a commit,
# a tag or a package back to GitHub.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # The canonical origin is compiled into the build, so it must be set while
  # `next build` runs rather than supplied at runtime.
  NEXT_PUBLIC_SITE_URL: https://ggitech.dev

jobs:
  quality:
    name: Validate & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Assemble the standalone release
        run: |
          set -euo pipefail

          rm -rf artifact
          mkdir -p artifact

          # `next build` with output: "standalone" writes a self-contained server
          # to .next/standalone but deliberately omits .next/static and public.
          # Both have to sit beside server.js, or the site serves valid HTML
          # whose every stylesheet and script 404s.
          cp -R .next/standalone/. artifact/
          cp -R .next/static artifact/.next/static
          cp -R public artifact/public

          # The activator refuses a release that cannot prove which commit it was
          # built from, so an artifact can never be activated under the wrong id.
          printf '%s\n' "$GITHUB_SHA" > artifact/RELEASE_SHA

          for required in server.js package.json .next/BUILD_ID .next/static public RELEASE_SHA; do
            if [[ ! -e "artifact/$required" ]]; then
              echo "::error::the assembled release is missing $required"
              exit 1
            fi
          done

      - name: Package the release
        run: |
          set -euo pipefail
          # A tarball rather than a bare directory: it round-trips symlinks and
          # file modes, including the .bin shims inside node_modules.
          tar -czf ggitech-release.tar.gz -C artifact .

      - name: Upload the release artifact
        uses: actions/upload-artifact@v4
        with:
          # The source commit is part of the artifact name, so a downloaded or
          # re-uploaded archive can always be traced back to the exact revision
          # it was built from rather than to the run that happened to make it.
          name: ggitech-release-${{ github.sha }}
          path: ggitech-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only high and critical advisories in production dependencies block a
      # release, so a low-severity transitive advisory cannot stop a deploy.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to ggitech.dev
    needs: [quality, audit]
    runs-on: ubuntu-latest

    # References a repository environment so that required reviewers, a wait
    # timer or a branch restriction can be attached in repository settings
    # without editing this file. With no protection rules configured, the job
    # proceeds as soon as the validation jobs pass.
    environment: production

    env:
      RELEASE_SHA: ${{ github.sha }}

    steps:
      # Cheap local guards, run before anything is downloaded or transferred.
      - name: Validate the release id
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::refusing to deploy: '$RELEASE_SHA' is not a 40-character lowercase git SHA"
            exit 1
          fi

      - name: Confirm this is the production branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::production deployments are only allowed from main (this run is on $GITHUB_REF)"
            exit 1
          fi

      # Full history, so an ancestry test can be made against the release that
      # is already live. Credentials are not persisted because this job never
      # writes back to the repository.
      - name: Checkout the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the release artifact
        uses: actions/download-artifact@v4
        with:
          name: ggitech-release-${{ github.sha }}

      - name: Unpack the release
        run: |
          set -euo pipefail
          mkdir -p release
          if ! tar -xzf ggitech-release.tar.gz -C release; then
            echo "::error::UPLOAD FAILED: the downloaded release artifact could not be unpacked; it is corrupt or was truncated during upload."
            exit 1
          fi
          for required in server.js RELEASE_SHA .next/static public; do
            if [[ ! -e "release/$required" ]]; then
              echo "::error::UPLOAD FAILED: the release artifact is missing $required."
              exit 1
            fi
          done

      # The host key is pinned from a secret with StrictHostKeyChecking on, so a
      # machine-in-the-middle cannot present a substitute server. The key itself
      # is only ever written to a 0600 file and is removed at the end of the job.
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GGITECH_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GGITECH_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.GGITECH_HOST }}
          DEPLOY_USER: ${{ secrets.GGITECH_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          {
            echo "Host ggitech-production"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 15"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Gate, not just a report. If the activator is absent, the sudoers rule is
      # missing or the application tree is incomplete, this deployment cannot
      # possibly succeed, and failing here says so clearly instead of letting a
      # 26 MB transfer complete and reporting a rollback of nothing. It also
      # records the revision that is live beforehand, so the staleness check
      # below has something authoritative to compare against.
      - name: Confirm the server-side deployment tooling is ready
        id: readiness
        run: |
          set -uo pipefail

          if ! status_output="$(ssh ggitech-production 'sudo -n /usr/local/bin/ggitech-activate --status' 2>&1)"; then
            printf '%s\n' "$status_output"
            echo "::error::the server-side deployment tooling is not ready. Complete the one-time setup in deploy/README.md (activator, sudoers rule, application tree) before deploying."
            exit 1
          fi

          printf 'Release state reported before this deployment:\n%s\n' "$status_output"

          # `active` is the last release that passed a full activation, and is
          # therefore the only one safe to reason about. `current` is reported
          # too but is deliberately not used here: it can point at a release
          # whose activation was interrupted and never verified.
          live="$(printf '%s\n' "$status_output" | sed -n 's/^active=//p' | head -n 1)"
          printf 'live_before=%s\n' "${live:-<none>}"
          printf 'live_before=%s\n' "${live:-none}" >> "$GITHUB_OUTPUT"

      # A queued run can begin after a newer commit has already been deployed.
      # Activating it would silently replace a newer, working release with an
      # older one, so the two commits are compared by ancestry rather than by
      # trusting the queue order.
      - name: Refuse to deploy a superseded commit
        id: superseded
        env:
          LIVE_SHA: ${{ steps.readiness.outputs.live_before }}
        run: |
          set -uo pipefail

          superseded=false

          if [[ -z "$LIVE_SHA" || "$LIVE_SHA" == "none" ]]; then
            echo "No release is live yet, so this is a first deployment and cannot be superseded."
          elif [[ "$LIVE_SHA" == "$RELEASE_SHA" ]]; then
            echo "The live release is already $RELEASE_SHA; re-activating it to re-verify it."
          elif ! git cat-file -e "${LIVE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::the live release $LIVE_SHA is not present in this checkout, so ancestry cannot be proven. Deploying anyway; a superseded release would still be caught by the health check."
          elif git merge-base --is-ancestor "$RELEASE_SHA" "$LIVE_SHA"; then
            superseded=true
            echo "::warning::SKIPPED: $RELEASE_SHA is an ancestor of the release already live ($LIVE_SHA). This run was queued behind a newer successful deployment; the newer commit is authoritative and nothing will be uploaded."
          else
            echo "$RELEASE_SHA is not an ancestor of the live release $LIVE_SHA; proceeding."
          fi

          printf 'superseded=%s\n' "$superseded" >> "$GITHUB_OUTPUT"

      - name: Upload the release to the server
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -uo pipefail
          remote="/home/deploy/uploads/$RELEASE_SHA"

          # A stale directory from an earlier attempt would leave files behind
          # that rsync never overwrites, so the target is recreated empty.
          if ! ssh ggitech-production "rm -rf -- '$remote' && mkdir -p -- '$remote'"; then
            echo "::error::UPLOAD FAILED: could not prepare $remote on the deployment host. Nothing was changed on the server."
            exit 1
          fi

          # No --delete, no --owner: the upload directory belongs to deploy, and
          # the activator re-owns and re-permissions everything after it moves
          # the artifact into the application tree.
          if ! rsync -rltz --chmod=D755,F644 -e ssh ./release/ "ggitech-production:$remote/"; then
            echo "::error::UPLOAD FAILED: transferring the release to $remote did not complete. The activator has not run, so the live release is untouched."
            exit 1
          fi

      # The activator is the only command deploy may run as root. It validates
      # the artifact, swaps the symlink atomically, restarts the service, polls
      # /api/health for this exact SHA and smoke-tests the homepage.
      #
      # Its exit codes are stable and documented at the top of the script, and
      # they are translated here so the Actions log says which kind of failure
      # happened instead of printing one undifferentiated "deployment failed".
      - name: Activate the release and verify it
        if: steps.superseded.outputs.superseded != 'true'
        id: activate
        run: |
          set -uo pipefail

          set +e
          ssh ggitech-production "sudo -n /usr/local/bin/ggitech-activate '$RELEASE_SHA'"
          rc=$?
          set -e

          if ((rc == 0)); then
            echo "ACTIVATION SUCCEEDED: $RELEASE_SHA is live, healthy and passing the homepage smoke test."
            exit 0
          fi

          case "$rc" in
            1) reason="ENVIRONMENT: the deployment host failed its preflight (missing directory, missing environment file, or the activator is not running as root)" ;;
            2) reason="USAGE: the activator rejected its arguments, which means the release id was malformed" ;;
            3) reason="INTEGRITY: the artifact for $RELEASE_SHA was not found in the upload directory, or a path escaped the releases directory" ;;
            4) reason="VALIDATION: the uploaded artifact failed content validation (unsafe entries, missing files, or a SHA mismatch against RELEASE_SHA)" ;;
            5) reason="CONCURRENCY: another activation is already in progress on the host; retry once it finishes" ;;
            6) reason="HEALTH CHECK: activation failed but the previous release was restored and is healthy. Production is serving the older revision" ;;
            7) reason="ROLLBACK FAILED: activation failed and rolling back did not restore service. Production requires manual intervention" ;;
            8) reason="NO ROLLBACK TARGET: activation failed and no verified previous release exists. Production requires manual intervention" ;;
            *) reason="UNEXPECTED: the activator exited with status $rc" ;;
          esac

          echo "::error::ACTIVATION FAILED (activator exit $rc) — $reason"
          exit 1

      # The activator is the single owner of recovery: on a failed activation it
      # attempts its own rollback and reports the outcome through its exit code.
      # This step therefore does not blindly roll back again -- doing so after
      # exit 6, where recovery already succeeded, would move production a second
      # release backwards. It only acts when the host reports no verified live
      # release, which is the interrupted-activation case, and it verifies the
      # result independently instead of trusting the exit code.
      - name: Recover an interrupted activation
        if: failure() && steps.superseded.outputs.superseded != 'true'
        run: |
          set -uo pipefail

          state="$(ssh ggitech-production 'sudo -n /usr/local/bin/ggitech-activate --status' 2>&1 || true)"
          printf 'Release state after the failed activation:\n%s\n' "$state"

          if grep -q '^verified=yes$' <<<"$state"; then
            echo "A verified release is live, so the activator already completed its own recovery. No second rollback is attempted."
          else
            echo "No verified release is live on the host, which means an activation was interrupted. Restoring the last verified release."
            if ! rollback_output="$(ssh ggitech-production 'sudo -n /usr/local/bin/ggitech-activate --rollback' 2>&1)"; then
              printf '%s\n' "$rollback_output"
              echo "::error::ROLLBACK FAILED: the activator could not restore the last verified release. Production requires manual intervention."
              exit 1
            fi
            printf '%s\n' "$rollback_output"
          fi

          health="$(ssh ggitech-production 'curl -fsS --max-time 10 http://127.0.0.1:3213/api/health' 2>&1)" || true
          printf 'post-recovery /api/health -> %s\n' "$health"

          if ! grep -q '"status":"ok"' <<<"$health"; then
            echo "::error::RECOVERY UNVERIFIED: no release is reporting healthy on the host. Production requires manual intervention."
            exit 1
          fi

          echo "RECOVERY VERIFIED: a release is live and reporting healthy."

      # A partially transferred artifact is never visible to the activator, but
      # leaving it behind wastes disk on a 1 vCPU / 2 GB host.
      - name: Discard an incomplete upload
        if: failure() && steps.superseded.outputs.superseded != 'true'
        continue-on-error: true
        run: ssh ggitech-production "rm -rf -- '/home/deploy/uploads/$RELEASE_SHA'"

      - name: Report the final release state
        if: always()
        continue-on-error: true
        run: |
          echo "Release state on the server after this run:"
          ssh ggitech-production 'sudo -n /usr/local/bin/ggitech-activate --status'

      - name: Remove deployment credentials from the runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config
