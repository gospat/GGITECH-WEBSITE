# /etc/nginx/sites-available/ggitech.conf
#
# Reverse proxy for https://ggitech.dev to the GGITECH Next.js standalone
# server, which listens on 127.0.0.1:3213.
#
# Scope: this file is self-contained. It does not include, and must not be
# included by, the Bells University certificate verification portal vhost.
# That portal keeps its own server block and its own upstream (port 3100); it
# is not referenced anywhere below and is unaffected by this configuration.
#
# Install (as an administrator):
#   sudo install -o root -g root -m 0644 \
#     deploy/nginx/ggitech.conf /etc/nginx/sites-available/ggitech.conf
#   sudo ln -sfn /etc/nginx/sites-available/ggitech.conf \
#     /etc/nginx/sites-enabled/ggitech.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate is the existing Let's Encrypt lineage. If it was issued under
# a different name, correct the two ssl_certificate paths in the HTTPS block
# only — do not re-issue it.

# WebSocket/SSE upgrade handling. `connection_upgrade` is a conventional name
# that other vhosts on this host may already define with a different value, so
# this map is deliberately namespaced to avoid a duplicate-declaration error.
map $http_upgrade $ggitech_connection_upgrade {
    default upgrade;
    ""      close;
}

# --- HTTP: certificate challenge, then redirect ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ggitech.dev www.ggitech.dev;

    # Let's Encrypt validates over plain HTTP, so this location has to stay
    # reachable before the redirect below is applied, or renewal fails the
    # moment a certificate expires.
    #
    # This serves the `--webroot` authenticator from /var/www/html. If the
    # existing certificate was issued with certbot's nginx plugin instead,
    # leave this block alone and keep renewing the same way: both mechanisms
    # can coexist, and certbot manages its own challenge location.
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
        try_files $uri =404;
    }

    # Nothing else is served over plain HTTP. Permanent redirect, with the path
    # and query string preserved.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    # Ubuntu 24.04 ships nginx 1.24, where HTTP/2 is enabled through the
    # listen directive. On nginx 1.25.1 or newer the `http2` parameter is
    # deprecated in favour of a bare `http2 on;` directive — either form is
    # accepted there, so this configuration is correct on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ggitech.dev www.ggitech.dev;

    # Existing Let's Encrypt lineage. Adjust the lineage name if different.
    ssl_certificate     /etc/letsencrypt/live/ggitech.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ggitech.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    # A distinctly named session cache, so this vhost cannot collide with a
    # cache zone the portal's configuration may define.
    ssl_session_cache shared:GGITECH_SSL:5m;
    ssl_session_tickets off;

    # Separate logs so application traffic never mixes into the portal's.
    access_log /var/log/nginx/ggitech.access.log;
    error_log  /var/log/nginx/ggitech.error.log warn;

    # Next.js compresses its own responses and sets its own cache headers for
    # content-hashed /_next/static assets, so nginx does neither here.

    # The largest legitimate request body is a JSON project brief.
    client_max_body_size 2m;

    # A deployment restarts the Node process, which leaves a sub-second window
    # where the upstream refuses connections and nginx generates its own 502.
    # The stock page is unbranded and alarming, so it is replaced with a short,
    # honest message. `proxy_intercept_errors` is deliberately NOT enabled, so
    # a 5xx produced by the application itself still reaches the client intact.
    error_page 502 @unavailable;
    location @unavailable {
        default_type "text/plain; charset=utf-8";
        add_header Retry-After 3 always;
        return 503 "GGI Tech is briefly unavailable while a new release starts. Please retry in a few seconds.\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3213;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # $proxy_add_x_forwarded_for appends the peer address to whatever the
        # client sent, so the rightmost entry is always written by nginx and
        # cannot be forged. The application trusts exactly one hop, which is
        # what makes its client-IP derivation safe despite the header being
        # client-controllable.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required for streaming/SSE responses; resolves to "close" for
        # ordinary requests.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ggitech_connection_upgrade;

        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
