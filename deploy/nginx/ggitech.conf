# GGITECH vhost — installed as /etc/nginx/sites-available/ggitech
#
# Reverse proxy for https://ggitech.dev to the GGITECH Next.js standalone
# server, which listens on 127.0.0.1:3213.
#
# Canonical domain
# ----------------
# ggitech.dev is the canonical host. It is the only host that serves the
# application; every other form of the address is redirected to it
# permanently, with the path and the query string carried across:
#
#   http://ggitech.dev/...       301 -> https://ggitech.dev/...
#   http://www.ggitech.dev/...   301 -> https://ggitech.dev/...
#   https://www.ggitech.dev/...  301 -> https://ggitech.dev/...
#
# Three things about that are deliberate.
#
# The redirect target is written out literally. $host is the name the client
# asked for, so a redirect written `https://$host$request_uri` on the www vhost
# would answer `https://www.ggitech.dev/...` — the very host that then has to
# redirect again — and the browser would bounce between them forever. A literal
# target cannot loop. $request_uri is still used for the path, because it is the
# original request line: it already carries the query string, and it is what
# makes the redirect preserve both.
#
# The www host gets its own HTTPS server block rather than an `if` inside the
# shared one. A client that asks for https://www.ggitech.dev has to complete a
# TLS handshake before any redirect can be delivered, so www has to be a
# server_name that nginx will answer for — and a server block says that once,
# plainly, instead of relying on an `if` whose conditions are easy to get subtly
# wrong.
#
# The certificate must cover both names. That is a property of the certificate,
# not of this file: a lineage issued for ggitech.dev alone makes
# https://www.ggitech.dev fail the handshake before the redirect is ever read.
# Step 9 of deploy/README.md checks this before the vhost is installed.
#
# Scope: this file is self-contained. It does not include, and must not be
# included by, the Bells University certificate verification portal vhost.
# That portal keeps its own server block and its own upstream (port 3100); it
# is not referenced anywhere below and is unaffected by this configuration.
#
# Install (as an administrator). This host ALREADY serves ggitech.dev from
# /etc/nginx/sites-available/ggitech, symlinked into sites-enabled under the
# same name. The existing files are therefore replaced in place — adding a
# second vhost (for example ggitech.conf) would leave two enabled server
# blocks competing for the same server_name and nginx would silently pick one.
#
#   ts=$(date +%Y%m%d%H%M%S)
#   sudo cp -a /etc/nginx/sites-available/ggitech \
#     /etc/nginx/sites-available/ggitech.bak.$ts
#   sudo install -o root -g root -m 0644 deploy/nginx/ggitech.conf \
#     /etc/nginx/sites-available/ggitech
#   sudo nginx -t && sudo systemctl reload nginx
#
# deploy/README.md documents the same procedure with the restore-on-failure
# branch and the check for conflicting GGITECH-only entries.
#
# The certificate is the existing Let's Encrypt lineage. If it was issued under
# a different name, correct the ssl_certificate paths in each HTTPS block — do
# not re-issue it.

# WebSocket/SSE upgrade handling. `connection_upgrade` is a conventional name
# that other vhosts on this host may already define with a different value, so
# this map is deliberately namespaced to avoid a duplicate-declaration error.
map $http_upgrade $ggitech_connection_upgrade {
    default upgrade;
    ""      close;
}

# --- HTTP: certificate challenge, then redirect ------------------------------
# One block answers both names on plain HTTP, so a renewal for a certificate
# covering both is served whichever name Let's Encrypt validates against.
server {
    listen 80;
    listen [::]:80;
    server_name ggitech.dev www.ggitech.dev;

    # Let's Encrypt validates over plain HTTP, so this location has to stay
    # reachable before the redirect below is applied, or renewal fails the
    # moment a certificate expires.
    #
    # The existing certificate was issued with the `--webroot` authenticator
    # using /var/www/ggitech-acme, so that is the directory certbot writes its
    # challenge token into. Pointing this location anywhere else (the previous
    # value here was the distro default /var/www/html) makes every renewal
    # request 404 while leaving the already-issued certificate working, so the
    # failure only surfaces at expiry. Change this only if the renewal
    # configuration in /etc/letsencrypt/renewal/*.conf says otherwise.
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/ggitech-acme;
        try_files $uri =404;
    }

    # Nothing else is served over plain HTTP. This is a single hop to the
    # canonical address even when the request arrived on www: the target is the
    # apex host, not the name that was asked for.
    location / {
        return 301 https://ggitech.dev$request_uri;
    }
}

# --- HTTPS: the application --------------------------------------------------
# ggitech.dev only. This is the block that proxies; the www block below never
# reaches the application, it only redirects to this one.
server {
    # Ubuntu 24.04 ships nginx 1.24, where HTTP/2 is enabled through the
    # listen directive. On nginx 1.25.1 or newer the `http2` parameter is
    # deprecated in favour of a bare `http2 on;` directive — either form is
    # accepted there, so this configuration is correct on both.
    #
    # This is the only declaration of `http2` for this 443 socket, and that is
    # deliberate: on nginx 1.24 a second declaration makes nginx warn
    # ("protocol options redefined for 0.0.0.0:443") because the other HTTPS
    # server blocks — www below, and the Bells portal vhost — share this one
    # listening socket. The www block records the reasoning in full.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ggitech.dev;

    # Existing Let's Encrypt lineage. Adjust the lineage name if different.
    ssl_certificate     /etc/letsencrypt/live/ggitech.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ggitech.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    # A distinctly named session cache, so this vhost cannot collide with a
    # cache zone the portal's configuration may define. The www block below
    # shares this zone deliberately — sessions are cached per certificate and
    # per protocol, and both blocks present the same certificate.
    ssl_session_cache shared:GGITECH_SSL:5m;
    ssl_session_tickets off;

    # Separate logs so application traffic never mixes into the portal's.
    access_log /var/log/nginx/ggitech.access.log;
    error_log  /var/log/nginx/ggitech.error.log warn;

    # Next.js compresses its own responses and sets its own cache headers for
    # content-hashed /_next/static assets, so nginx does neither here.

    # The largest legitimate request body is a JSON project brief.
    client_max_body_size 2m;

    # A deployment restarts the Node process, which leaves a sub-second window
    # where the upstream refuses connections and nginx generates its own 502.
    # The stock page is unbranded and alarming, so it is replaced with a short,
    # honest message. `proxy_intercept_errors` is deliberately NOT enabled, so
    # a 5xx produced by the application itself still reaches the client intact.
    #
    # `error_page` here has no `=`, which means it redirects only the body: the
    # client still sees the 502 nginx raised, not the 503 returned below. That
    # is the verified production behaviour and it is deliberate — adding the
    # `=` would raise the status to 503 and change what monitoring sees.
    error_page 502 @unavailable;
    location @unavailable {
        default_type "text/plain; charset=utf-8";
        add_header Retry-After 3 always;
        return 503 "GGI Tech is briefly unavailable while a new release starts. Please retry in a few seconds.\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3213;
        proxy_http_version 1.1;

        # $host here is always ggitech.dev, because that is the only name this
        # block answers for. www never reaches the application.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # $proxy_add_x_forwarded_for appends the peer address to whatever the
        # client sent, so the rightmost entry is always written by nginx and
        # cannot be forged. The application trusts exactly one hop, which is
        # what makes its client-IP derivation safe despite the header being
        # client-controllable.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required for streaming/SSE responses; resolves to "close" for
        # ordinary requests.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ggitech_connection_upgrade;

        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# --- HTTPS: www, redirected to the canonical host ----------------------------
# This block exists so that https://www.ggitech.dev answers at all: without it
# the handshake would be completed (the certificate covers the name) and the
# request would then fall through to the block above, which does not list www —
# and a request for a name no block claims is served by the default server for
# the port, i.e. the application, on the wrong host. Listing www here and
# redirecting is what makes the canonical host the only place the site is
# served.
#
# Nothing is proxied from here, so there is no upstream and no error_page: the
# only response this block can produce is the redirect.
server {
    # `ssl` only, deliberately, with no `http2`. On nginx 1.24 HTTP/2 is a
    # property of the listening socket, not of a virtual server, and every
    # HTTPS block on this host shares the one socket for 443. The block above
    # declares `ssl http2` for it, and the socket takes the union of the
    # protocol options declared for it, so HTTP/2 is negotiated here too —
    # a client that reaches this block over h2 is redirected exactly as one
    # that does not.
    #
    # Repeating `http2` here would add nothing to the socket and would make
    # nginx 1.24 warn:
    #
    #   protocol options redefined for 0.0.0.0:443
    #
    # because sharing a socket between server blocks is only meant to repeat
    # options, not to reintroduce them. The `ssl` keyword is still written out
    # even though the block above already sets it: it reads plainly, it is the
    # documented shorter repeat, and it does not warn.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ggitech.dev;

    # The same lineage as the block above — it has to be, or this vhost cannot
    # complete the handshake it is here to answer.
    ssl_certificate     /etc/letsencrypt/live/ggitech.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ggitech.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GGITECH_SSL:5m;
    ssl_session_tickets off;

    # Logged separately from the application's traffic, so a redirect never
    # looks like a request the application served.
    access_log /var/log/nginx/ggitech-www.access.log;
    error_log  /var/log/nginx/ggitech-www.error.log warn;

    # Permanent, and always to the apex host. $request_uri preserves the path
    # and the query string, so
    # https://www.ggitech.dev/services?utm_source=x
    # becomes https://ggitech.dev/services?utm_source=x.
    location / {
        return 301 https://ggitech.dev$request_uri;
    }
}
